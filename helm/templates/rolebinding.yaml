{{- if .Values.discovery.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "metatile-queue-populator-ui.backend.fullname" . }}-discovery
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "metatile-queue-populator-ui.labels" . | nindent 4 }}
    {{- include "metatile-queue-populator-ui.backend.selectorLabels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "metatile-queue-populator-ui.backend.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "metatile-queue-populator-ui.backend.fullname" . }}-discovery
  apiGroup: rbac.authorization.k8s.io
{{- end }}
